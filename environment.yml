name: compositeflow
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.8
  - pip
  # PyTorch + CUDA (matching your versions)
  - pytorch=2.2.0
  - torchvision=0.17.0
  - torchaudio=2.2.0
  - pytorch-cuda=12.1
  # Useful binary deps
  - ffmpeg
  - glfw
  - glew
  - freetype
  - lcms2
  - libpng
  - zlib
  # (optional but common)
  - jinja2
  - filelock
  - typing_extensions
  - numpy=1.23.5
  - pandas=1.4.4
  - scipy=1.10.1
  - networkx
  - sympy
  - yaml
  - setuptools
  - wheel

  - pip:
